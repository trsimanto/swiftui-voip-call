name: VoIPCall

options:
  bundleIdPrefix: dev.towhid.voipcall
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  # CallCore is built as an embedded framework inside Xcode. The same sources
  # also form the Swift package in Packages/CallCore, which is what `swift test`
  # uses on the command line.
  CallCore:
    type: framework
    platform: iOS
    sources:
      - path: Packages/CallCore/Sources/CallCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.towhid.voipcall.callcore
        PRODUCT_NAME: CallCore
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        DEFINES_MODULE: YES

  CallCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Packages/CallCore/Tests/CallCoreTests
    dependencies:
      - target: CallCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.towhid.voipcall.callcore.tests
        GENERATE_INFOPLIST_FILE: YES

  VoIPCall:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - target: CallCore
      - sdk: CallKit.framework
      - sdk: PushKit.framework
    info:
      path: Config/VoIPCall-Info.plist
      properties:
        CFBundleDisplayName: VoIP Call
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - audio
          - voip
        NSMicrophoneUsageDescription: VoIP Call needs the microphone so the person you are calling can hear you.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.towhid.voipcall
        PRODUCT_NAME: VoIPCall
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic

  VoIPCallTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AppTests
    dependencies:
      - target: VoIPCall
      # Link only; the host app already embeds the framework.
      - target: CallCore
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.towhid.voipcall.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  VoIPCall:
    build:
      targets:
        VoIPCall: all
        CallCore: all
        VoIPCallTests: [test]
        CallCoreTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - VoIPCall
        - CallCore
      targets:
        - name: CallCoreTests
          randomExecutionOrder: true
        - name: VoIPCallTests
          randomExecutionOrder: true
